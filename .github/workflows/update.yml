name: Update Dofus RSS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# ============================================================
# EMPÊCHE PLUSIEURS RUNS DU RSS EN MÊME TEMPS
# ============================================================

concurrency:
  group: dofus-rss-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ========================================================
      # SYNCHRONISATION AVANT GÉNÉRATION
      # ========================================================

      - name: Synchronize with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      # ========================================================
      # DEPENDANCES
      # ========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ========================================================
      # PLAYWRIGHT
      # ========================================================

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      # ========================================================
      # GENERATION DOFUS NEWS
      # ========================================================

      - name: Generate Dofus News RSS
        run: |
          python generate_dofus_news.py

      # ========================================================
      # GENERATION DOFUS CHANGELOG
      # ========================================================

      - name: Generate Dofus Changelog RSS
        run: |
          python generate_dofus_changelog.py

      # ========================================================
      # COMMIT + PUSH
      # ========================================================

      - name: Commit generated feeds
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

           git add \
            dofus-news.xml \
            dofus-news-discord.xml \
            dofus_news_cache.json \
            dofus_discord_state.json \
            dofus-changelog.xml \
            dofus-changelog-discord.xml \
            dofus_changelog_cache.json \
            dofus_changelog_discord_state.json

          # ----------------------------------------------------
          # Aucun changement
          # ----------------------------------------------------

          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement à commit."
            exit 0
          fi

          # ----------------------------------------------------
          # Commit
          # ----------------------------------------------------

          git commit -m "Update Dofus RSS feeds"

          # ----------------------------------------------------
          # Push
          # ----------------------------------------------------

          git push origin HEAD:main
