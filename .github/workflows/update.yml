name: Update Dofus RSS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Synchronize with main
        run: |
          git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Generate Dofus News RSS
        run: |
          python generate_dofus_news.py

      - name: Generate Dofus Changelog RSS
        run: |
          python generate_dofus_changelog.py

      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git diff --cached --quiet || git commit -m "Update Dofus RSS feeds"

          git pull --rebase origin main

          git push

          # ----------------------------------------------------
          # Aucun changement
          # ----------------------------------------------------

          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement à commit."
            exit 0
          fi

          # ----------------------------------------------------
          # Commit
          # ----------------------------------------------------

          git commit -m "Update Dofus RSS feeds"

          # ----------------------------------------------------
          # Push
          # ----------------------------------------------------

          git push origin HEAD:main
