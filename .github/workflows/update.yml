name: Update Dofus RSS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Empêche deux exécutions du même workflow
# de générer et pousser les fichiers en même temps.
concurrency:
  group: update-dofus-rss
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Generate Dofus News RSS
        run: |
          python generate_dofus_news.py

      - name: Generate Dofus Changelog RSS
        run: |
          python generate_dofus_changelog.py

      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            dofus-news.xml \
            dofus-news-discord.xml \
            dofus_news_cache.json \
            dofus_discord_state.json \
            dofus-changelog.xml \
            dofus-changelog-discord.xml \
            dofus_changelog_cache.json

          if git diff --cached --quiet; then
            echo "Aucun changement à commit."
            exit 0
          fi

          git commit -m "Update Dofus RSS feeds"

          echo "Récupération des éventuels commits distants..."
          git fetch origin main

          echo "Rebase sur origin/main..."
          git rebase origin/main

          echo "Push vers GitHub..."
          git push origin HEAD:main
